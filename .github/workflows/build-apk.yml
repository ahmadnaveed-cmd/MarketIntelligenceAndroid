name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract zip and organize app folder
        run: |
          mkdir -p temp_extract
          unzip -o "*.zip" -d temp_extract
          APP_DIR=$(find temp_extract -type d -name "app" | head -n 1)
          if [ -n "$APP_DIR" ]; then
            rm -rf app
            mv "$APP_DIR" ./app
          fi
          rm -rf temp_extract

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MarketIntelligence-debug-apk
          path: app/build/outputs/apk/debug/*.apk
